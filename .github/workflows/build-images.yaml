name: Build and publish images

# Fork of upstream's build-images.yaml (TheSpaghettiDetective/obico-server),
# trimmed to just what hibikipr/homelab's obico stack actually consumes:
# ml-api-cpu, now also built for linux/arm64 (upstream only publishes
# amd64 - this fork exists specifically because that doesn't run natively
# on the arm64 Mac Studio this stack is deployed to; see homelab's own
# stacks/obico/docker-compose.yml comment). web and ml-api-gpu are kept in
# the matrix unchanged (still amd64-only, still built) since they cost
# nothing extra to leave in and diverging the matrix shape from upstream
# would make future upstream merges harder - just unused by this
# deployment. Cosign signing and the Helm chart publish job (upstream's
# Kubernetes-focused parts, no Kubernetes/Helm anywhere in this docker-
# compose-only deployment) are dropped.

on:
  # The release branch is the deploy branch; rebuild whenever it moves.
  push:
    branches: [release]
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Computed once so every matrix entry in build (a separate job) tags its
  # image with the same namespace/version rather than each recomputing it
  # independently and risking a UTC-midnight race producing mismatched
  # CalVers across images from the same commit.
  version:
    runs-on: ubuntu-latest
    outputs:
      ns: ${{ steps.ns.outputs.ns }}
      version: ${{ steps.ver.outputs.version }}
      short_sha: ${{ steps.ver.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit date and any tags are available for
          # versioning.
          fetch-depth: 0

      - name: Compute image namespace (GHCR requires a lowercase owner)
        id: ns
        run: echo "ns=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - name: Compute version
        id: ver
        run: |
          # The release branch carries no tag or in-repo VERSION, so derive a
          # CalVer from the commit date (UTC) — deterministic and monotonic with
          # commit order. It is day-granular: two commits on the same UTC day
          # share it, and the second run moves the tag. The sha-<short> tag below
          # is the immutable, guaranteed-unique per-commit pin. If the project
          # ever starts tagging releases, an exact tag on the commit takes
          # precedence.
          tag="$(git describe --tags --exact-match 2>/dev/null || true)"
          if [ -n "${tag}" ]; then
            version="${tag#v}"
          else
            version="$(date -u -d "@$(git show --no-patch --format=%ct HEAD)" +'%Y.%-m.%-d')"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # Publish each image independently — one failing build must not block the
      # others.
      fail-fast: false
      matrix:
        include:
          - name: web
            context: backend
            file: backend/Dockerfile
            platforms: linux/amd64
          - name: ml-api-cpu
            context: ml_api
            file: ml_api/Containerfile.cpu
            # The one platform addition this fork exists for - see the
            # top-of-file comment.
            platforms: linux/amd64,linux/arm64
          - name: ml-api-gpu
            context: ml_api
            file: ml_api/Dockerfile
            # CUDA-based, amd64-only by nature - no arm64 build possible.
            platforms: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Versioning moved to the version job, so a shallow checkout of HEAD is
        # enough to build the image.

      - name: Move the prebuilt frontend into the web build context
        if: matrix.name == 'web'
        run: |
          # The backend image expects the prebuilt Vue bundle (checked into the
          # release branch) at /frontend, which docker-compose supplies as a bind
          # mount. Bake it into the image instead.
          mv frontend backend/frontend
          echo 'RUN ln -s /app/frontend /frontend' >> backend/Dockerfile

      # Needed for the arm64 leg of ml-api-cpu's multi-platform build - the
      # runner itself is amd64, so building for arm64 goes through QEMU
      # emulation. Harmless no-op for the amd64-only matrix entries.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.ns }}/obico-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=sha-${{ needs.version.outputs.short_sha }}
            type=raw,value=release,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=obico-${{ matrix.name }}
            org.opencontainers.image.description=Obico ${{ matrix.name }} image built from obico-server source
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
